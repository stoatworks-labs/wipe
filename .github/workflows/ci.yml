name: ci

# Both platforms on every push and pull request, so a Dependabot bump has a
# status check to gate on and a GLEW-shaped break -- which macOS is
# structurally blind to, because macOS never links GLEW -- is caught before a
# tag. Both build the OpenFX plugin as well as the FFGL one (BUILD_OFX is on by
# default). There is no Linux job here: Resolume has no Linux build, and the
# OpenFX plugin's Linux build and its Rocky 8 load test are release.yml's
# linux-ofx and linux-load, which a workflow_dispatch of release.yml runs.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    name: macOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          # The FFGL SDK is a submodule. Without this CMake fails at configure
          # time with a missing-directory error that reads like a broken repo.
          submodules: recursive

      - name: Configure
        # arm64 only, unlike the release build's universal arm64;x86_64 -- the
        # second slice doubles the build for no extra signal, because a source
        # break is not architecture-specific.
        #
        # WIPE_BUILD_TOOLS is ON here where the release build turns it OFF:
        # wptest is where the two inputs, the edge, the area and the slopes
        # are actually measured, so compiling and running it is most of the
        # value.
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DWIPE_BUILD_TOOLS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: The suites
        # The runner has no GPU, so everything but --names runs on Apple's
        # software renderer. Its interpolated uv is good only to the GL
        # spec's 1 part in 10^5, and --area's first runs here failed until
        # its tolerance allowed for that (AGENTS.md, the trap "The software
        # renderer's uv is good to 1 part in 10^5"). tools/verify.sh runs
        # the same suites on the same renderer locally, with
        # WPTEST_RENDERER=software, so a check that would fail here fails
        # there first. --cpu is among them: the OpenFX build's C++ copy of
        # the wipe shader against the GLSL, pixel for pixel.
        run: ctest --test-dir build --output-on-failure

      - name: The OpenFX bundle
        # Built, exports its entry point, and its plist names the binary on
        # disk -- checked by the exact codesign the release job runs, which
        # is the only thing that notices a CFBundleExecutable copied from
        # another plugin. Captured and matched with `case`, not piped into
        # grep -q: under `bash -eo pipefail` a grep that FINDS its match
        # SIGPIPEs the writer and fails the step.
        shell: bash
        run: |
          bin="build/Wipe.ofx.bundle/Contents/MacOS/Wipe.ofx"
          test -f "$bin"
          __symbols=$( nm -gU "$bin" )
          case "$__symbols" in
            *_OfxGetPlugin*) ;;
            *) echo "expected _OfxGetPlugin"; exit 1 ;;
          esac
          cp -R build/Wipe.ofx.bundle "$RUNNER_TEMP/"
          codesign --force --sign - --timestamp=none "$RUNNER_TEMP/Wipe.ofx.bundle"

      - name: Controls
        # At 320x180, because the runner has no GPU and the question is only
        # whether a control changed ANY subpixel. Two at a time on a
        # three-core runner; graticule learned that an eight-wide pool at
        # 320x180 was still going at twenty minutes. Twenty-one controls here
        # against rosette's forty-four, so it should be comfortable.
        timeout-minutes: 25
        run: python3 tools/sweep.py --size 320x180 --jobs 2

      # Uploading is not only for the artefact. This repo has no package
      # manifest, so github-actions is its only Dependabot ecosystem -- and a
      # bump to actions/upload-artifact otherwise touches release.yml alone,
      # a workflow no pull request ever runs.
      - uses: actions/upload-artifact@v4
        with:
          name: wipe-macos-arm64
          path: build/*.bundle
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: wipe-ofx-macos-arm64
          path: build/Wipe.ofx.bundle
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        # The toolchain path MUST stay double-quoted: a `run:` step on Windows
        # is PowerShell, and unquoted this expands to nothing.
        run: >
          cmake -B build -A x64
          -DCMAKE_BUILD_TYPE=Release
          -DWIPE_BUILD_TOOLS=OFF
          -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release --parallel

      - uses: actions/upload-artifact@v4
        with:
          name: wipe-windows-x86_64
          path: build/Release/*.dll
          if-no-files-found: error

      # The OpenFX build's Win64 binary. MSVC is where the OFX target's output
      # directories have to be pinned per configuration, and where its import
      # library would race the FFGL target's (LNK1104) -- see CMakeLists.txt.
      # A missing file here fails the job rather than a release.
      - uses: actions/upload-artifact@v4
        with:
          name: wipe-ofx-windows-x86_64
          path: build/Wipe.ofx.bundle/Contents/Win64/Wipe.ofx
          if-no-files-found: error
